; Конфигурация на pytest за Multi-Bot.
;
; pythonpath = .  ->  добавя корена на проекта в sys.path, за да могат
;                     тестовете да импортират пакета src/ без инсталация.
; testpaths      ->  pytest търси тестове само в tests/ (не в .venv!).
; -m "not eval"  ->  eval тестовете (реални LLM извиквания, реални пари)
;                     са ИЗКЛЮЧЕНИ по подразбиране; пускат се изрично с:
;                     pytest -m eval   (последният -m печели над addopts)
[pytest]
testpaths = tests
pythonpath = .
addopts = -q -m "not eval"
markers =
    eval: качествени evals с реални LLM извиквания (пускай с: pytest -m eval)
