; Конфигурация на pytest за Multi-Bot.
;
; pythonpath = .  ->  добавя корена на проекта в sys.path, за да могат
;                     тестовете да импортират пакета src/ без инсталация.
; testpaths      ->  pytest търси тестове само в tests/ (не в .venv!).
[pytest]
testpaths = tests
pythonpath = .
addopts = -q
