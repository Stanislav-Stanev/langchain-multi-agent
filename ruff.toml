# Конфигурация на ruff (линтер + формат проверка) - improvement.md §3.1.
#
# Философия: линтерът пази от РЕАЛНИ дефекти (неизползвани импорти,
# недефинирани имена, счупени f-string-ове), без да се бори със стила
# на учебния проект (дълги обяснителни коментари на български).

line-length = 100
target-version = "py312"

[lint]
# E/W: pycodestyle, F: pyflakes, I: подредба на импортите,
# B: bugbear (чести реални бъгове), UP: остарели конструкции
select = ["E", "W", "F", "I", "B", "UP"]
# E501: дългите редове са предимно български коментари/промптове -
# line-length 100 е меката граница, но не режем заради текст.
ignore = ["E501"]

[lint.per-file-ignores]
# В тестовете е нормално да има "магически" стойности и дълги данни
"tests/**" = ["B011"]
