# CI pipeline на Multi-Bot (improvement.md §3.1).
#
# Пуска се на всеки PR и на всеки push към main. Три порти:
#   1. ruff  - линтер (реални дефекти: неизползвани импорти, бъгове);
#   2. pytest - детерминистичният пакет (без LLM извиквания, без тайни);
#   3. coverage - минимален праг на покритието на src/.
#
# Eval тестовете (реални LLM разходи) НЕ се пускат тук - те са
# изключени по подразбиране (pytest.ini: -m "not eval") и се пускат
# ръчно/по график, когато има бюджет за тях.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Инсталиране на зависимостите
        run: pip install -r requirements.txt

      - name: Ruff (линтер)
        run: ruff check .

      - name: Pytest + покритие
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=85
